quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:file:~/data/h2db/mydb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
quarkus.datasource.username=sa
quarkus.datasource.password=

quarkus.h2.console.enabled=true
quarkus.h2.console.path=/h2-console

quarkus.hibernate-orm.log.sql=true
# quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.database.generation=update
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:4200,https://your-frontend-domain.com
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS